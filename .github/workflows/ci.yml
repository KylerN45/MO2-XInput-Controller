name: CI

env:
  PYTHONPATH: src

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Compile
        shell: pwsh
        run: python -m compileall -q src build_package.py
      - name: Package
        shell: pwsh
        run: python build_package.py
